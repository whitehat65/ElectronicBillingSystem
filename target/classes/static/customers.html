<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Electricity Billing System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>⚡ EBS</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="customers.html" class="active">Customers</a></li>
                <li><a href="meters.html">Meters</a></li>
                <li><a href="tariffs.html">Tariffs</a></li>
                <li><a href="readings.html">Readings</a></li>
                <li><a href="bills.html">Bills</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>Customers</h1>
                <button class="btn btn-primary" onclick="showAddForm()">+ Add Customer</button>
            </div>
            
            <!-- Add Customer Form -->
            <div id="addForm" class="form-section" style="display: none;">
                <h2>Add New Customer</h2>
                <form id="customerForm" onsubmit="handleSubmit(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="contactPhone">Phone</label>
                            <input type="tel" id="contactPhone">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contactEmail">Email</label>
                            <input type="email" id="contactEmail">
                        </div>
                        <div class="form-group">
                            <label for="connectionNo">Connection No</label>
                            <input type="text" id="connectionNo">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="tariffId">Tariff</label>
                        <select id="tariffId" required>
                            <option value="">Select Tariff</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Customer</button>
                        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
                    </div>
                </form>
            </div>
            
            <!-- Customers List -->
            <div class="content-section">
                <h2>All Customers</h2>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Connection No</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customersTable">
                            <tr>
                                <td colspan="6" class="loading">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
