spring.datasource.url=jdbc:h2:mem:ebsdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensure Hibernate generates H2-compatible SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Use port 8080 for local profile to match frontend expectations and avoid conflicts
server.port=8080

# Disable SQL init scripts here ? DataInitializer (Java) will populate the admin user after JPA creates tables
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:/data-local.sql
