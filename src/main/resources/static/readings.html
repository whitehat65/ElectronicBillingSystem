<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readings - Electricity Billing System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>⚡ EBS</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="meters.html">Meters</a></li>
                <li><a href="tariffs.html">Tariffs</a></li>
                <li><a href="readings.html" class="active">Readings</a></li>
                <li><a href="bills.html">Bills</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>Meter Readings</h1>
                <button class="btn btn-primary" onclick="showReadingForm()">+ Add Reading</button>
            </div>
            
            <!-- Add Reading Form -->
            <div id="readingForm" class="form-section" style="display: none;">
                <h2>Record Meter Reading</h2>
                <form id="readingFormElement" onsubmit="handleReading(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="meterId">Meter *</label>
                            <select id="meterId" required>
                                <option value="">Select Meter</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="readingDate">Reading Date *</label>
                            <input type="date" id="readingDate" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="readingValue">Reading Value *</label>
                        <input type="number" id="readingValue" step="0.001" required placeholder="Enter meter reading">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Reading</button>
                        <button type="button" class="btn btn-secondary" onclick="hideReadingForm()">Cancel</button>
                    </div>
                </form>
            </div>
            
            <!-- Readings List -->
            <div class="content-section">
                <h2>All Readings</h2>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Reading ID</th>
                                <th>Meter No</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Value</th>
                            </tr>
                        </thead>
                        <tbody id="readingsTable">
                            <tr>
                                <td colspan="5" class="loading">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/readings.js"></script>
</body>
</html>
